<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeetCode Randomizer</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="header-brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="26 26 76 76" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M34 98V30H54L76 67.4V30H94V98H74L52 60.6V98Z"
                fill="currentColor"
              />
            </svg>
          </div>
          <div class="header-copy">
            <h1>NeetCode Randomizer</h1>
            <p class="subtitle">
              Random NeetCode practice, one problem at a time.
            </p>
          </div>
        </div>
        <button type="button" id="progress-button" class="button secondary header-button">
          Progress
        </button>
      </header>

      <section id="session-view" class="panel session-view" hidden></section>

      <form id="filters-form" class="panel controls" hidden>
        <div class="setup-block">
          <div class="setup-row">
            <div class="field">
              <label for="problem-list-select">Problem list</label>
              <select id="problem-list-select" name="problemList"></select>
            </div>

            <div class="field">
              <label for="question-count">Number of questions</label>
              <select id="question-count" name="count"></select>
            </div>
          </div>
          <div class="setup-hint">
            <p id="question-count-hint" class="field-note"></p>
            <label class="inline-check" id="include-pro-option">
              <input type="checkbox" id="include-pro" name="includePro" />
              <span>Include Pro</span>
            </label>
          </div>
        </div>

        <fieldset class="field">
          <div class="topic-header">
            <legend>Topics</legend>
            <label class="inline-check">
              <input type="checkbox" id="all-topics" checked />
              <span>All topics</span>
            </label>
          </div>
          <div id="topic-grid" class="topic-grid"></div>
        </fieldset>

        <fieldset class="field field--inline">
          <legend>Difficulty</legend>
          <div class="checkbox-grid">
            <label class="checkbox-option">
              <input type="checkbox" name="difficulty" value="Easy" checked />
              <span>Easy</span>
            </label>
            <label class="checkbox-option">
              <input type="checkbox" name="difficulty" value="Medium" checked />
              <span>Medium</span>
            </label>
            <label class="checkbox-option">
              <input type="checkbox" name="difficulty" value="Hard" checked />
              <span>Hard</span>
            </label>
          </div>
        </fieldset>

        <div class="field">
          <label class="toggle-option" for="auto-reset-enabled">
            <span>
              <strong>Auto-reset solved code</strong>
              <small>Reset the editor when a queued problem opens.</small>
            </span>
            <input
              type="checkbox"
              id="auto-reset-enabled"
              name="autoResetEnabled"
              checked
            />
          </label>
        </div>

        <div class="actions">
          <button type="submit" id="generate-button" class="button primary">
            Start Session
          </button>
        </div>

        <p id="status-message" class="status-message" aria-live="polite"></p>
      </form>
    </main>

    <script src="ui-helpers.js"></script>
    <script src="data/problem-lists.js"></script>
    <script src="data/recommender.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
